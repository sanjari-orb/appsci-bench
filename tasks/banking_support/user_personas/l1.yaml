persona_id: l1
task_id: banking_support
level: L1
role: "Applied-science manager overseeing the Rho-Bank customer-service-agent build"
domain_knowledge:
  task: "a knowledge-grounded agent that advises customers and drives correct account actions (applications, referrals, disputes, servicing) over the banking DB + tools"
  corpus_too_large: "the rules that make an answer correct live across ~700 documents; the agent searches them with the PROVIDED retrieval tools (KB_search_bm25/KB_search_dense/shell) rather than building its own -- you cannot stuff the corpus into a prompt"
  grounding_gates_action: "correct handling -- including WHICH specialized (discoverable) tool to use -- is gated on retrieving the right knowledge-base doc; the doc names the tool to unlock/call"
  no_fabrication: "the agent must ground every answer/action in the retrieved docs and must never invent policies, fees, eligibility, or capabilities; if the KB doesn't cover it, say so / transfer"
  verify_before_acting: "identity must be verified (2 of 4 of dob/email/phone/address, then log_verification) before any account action"
  refusals_and_transfers: "transferring to a human is correct only when the KB describes no applicable action -- not as a shortcut"
  # What this manager can say about judging the agent: the OUTCOME bar, and deliberately not the
  # measurement. This entry used to name the upstream benchmark this task is cast from and then spell
  # out how its reward is computed -- two separate leaks in one sentence, and this file is the wrong
  # place to restate either, so neither is repeated here.
  #
  # Naming the source benchmark points a frontier model at a PUBLIC dataset it may hold in training
  # data. That is this task's threat #1 (KNOWN_ISSUES.md section 1) and it is fatal to a task whose
  # premise is that correct handling is gated on RETRIEVING a document rather than recalling one.
  # Describing the measurement is the leak 81178b3 already closed through another channel, on the
  # principle that withholding the ORACLE is not enough if the MECHANISM is published. A persona is the
  # worse channel of the two, because the simulator volunteers it the moment the agent asks how it is
  # judged -- so what it knows is the bar the business sets, which is what a manager would actually say.
  how_we_judge_it: "what counts is whether the conversation reached the outcome the bank's rules require -- the customer's records end up in the right state, or the right action is taken and handed over -- not how fluent the reply reads; an action the CUSTOMER performs themselves counts just as much as one the agent takes"
  customers_are_unreliable: "customers are often wrong or vague about products, eligibility, or what they're owed; the agent should check the KB, not take their word"
# Resources (by spec name) this manager can speak to. L1 knows the data/corpus/tool landscape + how
# it's scored. The policy and the success KPIs are NOT listed: neither is published to the agent, so
# there is no resource entry to point at -- L1 carries the policy as the knowledge above instead.
known_resources:
  - banking_db
  - knowledge_base
