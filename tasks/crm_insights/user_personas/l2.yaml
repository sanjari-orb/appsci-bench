persona_id: l2
task_id: crm_insights
level: L2
role: "Senior data engineer who owns the CRM database + build infra"
domain_knowledge:
  db_access: "crm_db is Postgres at DATABASE_URL (postgres://sandbox:sandbox@db:5432/crm_insights), read-only -- see RESOURCES.md. /work is the writable scratch directory; artifact outputs go in /work/out."
  db_schema: "8 tables mirroring a real Salesforce-style object model (Case/Account/User/CaseHistory__c/Order/OrderItem/Issue__c/Product2) -- see environment/data/schema_reference.md for exact columns."
  freshness: "crm_db is loaded once from a real CRM snapshot fixture at setup and never changes -- it's the same store at build and eval time, not a build-time preview of a different eval dataset."
  data_shape: "Rows are structured CRM records (cases, accounts, users, order/product records) -- there's no free text to parse, the hard part is picking the right joins and filters, not extraction."
  what_counts_as_problem: |
    A correct answer matches the real value a correct query against crm_db would produce -- these
    are point lookups (an id, a state code, a month name), evaluated by exact match (or fuzzy match
    for free-text categories), same as the source benchmark. There's no partial credit for "close."
  what_doesnt_count: |
    Restating the question, giving a plausible-sounding but unsupported number, or citing case ids
    that don't actually relate to the answer -- grounding is precision AND recall over the cited vs.
    actually-supporting case ids, so padding the citation list with extra or fabricated ids costs you
    just as much as leaving real ones out.
  validation_rules: |
    Two objectives, equally weighted:
    1. answer_correctness -- does the reported answer match the real ground truth value.
    2. grounding -- do the cited case ids overlap with the records that actually support the answer.
  expected_output: |
    {"answer": <id|code|month string>, "evidence_case_ids": [<case id>, ...]}
  priority: "I care about the artifact querying crm_db correctly and staying within the read-only
    contract -- whether it also gets the business conventions right (date windows, tie-break
    order) is between the analyst asking the question and the agent, not something I track."
known_resources:
  - crm_db
  - schema_reference
  - kpis
