persona_id: l2
task_id: compliance_review
level: L2
role: "Senior engineer who owns the policy corpus and document ingestion pipeline"
domain_knowledge:
  storage: "Policy corpus lives under /data/policies/, one file per policy. Contracts live in Postgres (contracts_db), table contracts(contract_id, title, full_text), read-only."
  data_shape: "Contract text is free text (one row per contract in contracts_db); a policy is a structured list of rules, each pairing a clause/disclosure category with a rule type. Category names must match the shared taxonomy exactly -- a rule referencing an unknown category is a pipeline bug, not a document issue."
  deploy_constraint: "Artifact reads contracts_db and policy files read-only; nothing is written back to the corpus, and there's no schema to migrate."
  freshness: "contracts_db holds a static build-time snapshot of 50 contracts. Production documents would come from the org's document management system -- wiring that up is out of scope for this build."
  imbalance: "Most documents come back clean against most policies; violations are the minority class."
  what_counts_as_problem: |
    A finding is a real violation only when it maps to a rule in the policy being checked:
    - A required clause/disclosure is missing (must_have rule)
    - Prohibited language is present (must_not_have rule) -- must be backed by the exact offending span
    A category flagged needs_review, when present, is NOT a violation -- it's routed to a human, not counted as a fault.
  what_doesnt_count: |
    These should NOT be reported as violations (they create noise):
    - A span-level match that doesn't correspond to any rule in the policy being checked
    - A "violation" with no quoted span from the document to back it
    - Stylistic or paraphrase concerns unrelated to the rule's category
  validation_rules: |
    For each rule in the applicable policy, in order:
    1. must_have -> violation if the clause/category is absent from the document
    2. must_not_have -> violation if the clause/category is present; evidence = the offending span(s)
    3. needs_review -> if the category is present, add to needs_review (not a violation)
    Verdict: compliant = true only if the violations list is empty.
  rule_types: |
    Rule type enum values (per policy rule):
    - must_have: violation if the clause/category is ABSENT
    - must_not_have: violation if the clause/category is PRESENT (evidence = offending span)
    - needs_review: not pass/fail; surfaced to a human reviewer if the clause/category is PRESENT
# Resources (by spec name) this engineer can speak to. L2 owns the data/infra landscape.
known_resources:
  - contracts_db
  - policy_kb
