technical_issues:
  - at: 2026-09-18T11:55:00Z
    issue: >
      Environment setup friction, resolved before the clock started, so no problem-solving time was
      consumed. Docker was not running. The local setup script then aborted partway through, at the
      step that installs the agent-harness CLIs, because Node.js is absent from this host; that step
      is only needed for running the automated agent harnesses and is irrelevant to a human baseline.
      Because the script aborted, it never reached its final step and the two shared container images
      were left two days stale. Re-ran the script with the harness-CLI step skipped so the images
      rebuilt.
    resolved_by: P4 + Claude Code
    extra_time_granted: false
  - at: 2026-09-18T12:20:00Z
    issue: >
      The standard elicitation entry point could not be used as shipped, for two reasons, and neither
      cost meaningful time. First, it drives an interactive prompt that needs a real terminal, so a
      Claude Code session cannot type into it; second, this host carries only gateway credentials
      under the vendor-specific variable names, and that entry point expects the shared model-config
      names, so the stakeholder simulator would have had no model to call. Worked around by running
      the same simulator as a local service and asking it over its documented HTTP interface, with the
      gateway credentials mapped exactly as the repo's own setup script maps them. Same simulator,
      same persona, same task spec, same one-question-at-a-time conversation, and every exchange is
      logged to the attempt transcript. Two deliberate differences from the shipped entry point: the
      simulator's rendered system prompt is not printed or read, since it carries the stakeholder's
      private fact set that an agent under test never sees; and the conversation is driven by Claude
      Code rather than typed by hand, which is within the disclosed tooling for this study.
    resolved_by: P4 + Claude Code
    extra_time_granted: false
  - at: 2026-09-18T15:26:00Z
    issue: >
      The iterative dev-loop helper deploys the artifact with the task's agent environment copied
      straight out of the task spec, without substituting the two placeholders the spec leaves for the
      runner to fill in. The artifact therefore received a literal placeholder as the tool-API address
      and another as its token, so every tool call failed and the agent politely told the customer the
      reservation system was down. The scoring path is unaffected: it takes its environment from the
      task runner, which does perform the substitution, so checkpoints and the final score inject the
      real values. The workaround was to build and run the artifact container by hand on the shared
      network with the correct address and token. Roughly fifteen minutes of problem-solving time was
      spent, and the timer was NOT paused for it, since diagnosing it is ordinary work. Worth a
      separate fix in the harness so the next baseliner does not lose the same quarter hour.
    resolved_by: P4 + Claude Code
    extra_time_granted: false
notes:
  - >
      Eval-time user simulator runs through a gateway alias rather than the first-party model id the
      public leaderboard uses. The setup script reports this as NEAR-parity: the same underlying
      model, but what the gateway routes the alias to cannot be verified from this host. Scores from
      this attempt are comparable to other runs made through the same gateway; treat cross-comparison
      with published leaderboard numbers as carrying that caveat.
  - >
      S3 run mirroring was deliberately skipped, so this attempt stays local and is not loadable by
      run id from the shared mirror. It can be uploaded later if wanted.
