<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banking Support Sim</title>
<style>
  :root { --bg:#0f1420; --panel:#1a2130; --line:#2a3446; --fg:#e6ebf2; --muted:#8b97a8;
          --user:#2b6cff; --bot:#243247; --accent:#3ddc97; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg);
         color:var(--fg); height:100vh; display:flex; }
  .col { display:flex; flex-direction:column; height:100vh; }
  #chatCol { flex:1 1 60%; border-right:1px solid var(--line); }
  #inspectCol { flex:1 1 40%; max-width:520px; background:var(--panel); }
  header { padding:12px 16px; border-bottom:1px solid var(--line); font-weight:600; }
  header small { display:block; color:var(--muted); font-weight:400; }
  #log { flex:1; overflow-y:auto; padding:16px; }
  .msg { margin:0 0 10px; padding:9px 12px; border-radius:10px; max-width:85%; white-space:pre-wrap;
         word-wrap:break-word; }
  .user { background:var(--user); margin-left:auto; }
  .assistant { background:var(--bot); }
  .role { font-size:11px; color:var(--muted); margin:0 0 2px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  textarea, input, select, button { font:inherit; }
  #box { flex:1; resize:none; height:44px; padding:10px; border-radius:8px; border:1px solid var(--line);
         background:#0c111b; color:var(--fg); }
  button { background:var(--accent); color:#04231a; border:0; border-radius:8px; padding:0 16px;
           font-weight:600; cursor:pointer; }
  button.secondary { background:var(--bot); color:var(--fg); }
  button:disabled { opacity:.5; cursor:default; }
  .pad { padding:16px; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  .row select, .row input { flex:1; padding:8px; border-radius:8px; border:1px solid var(--line);
         background:#0c111b; color:var(--fg); }
  pre { background:#0c111b; border:1px solid var(--line); border-radius:8px; padding:12px;
        overflow:auto; max-height:calc(100vh - 220px); white-space:pre-wrap; }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 12px; }
</style>
</head>
<body>
  <div class="col" id="chatCol">
    <header>Customer chat
      <small>You are the customer. The agent replies through the artifact's /respond.</small>
    </header>
    <div id="log"></div>
    <form id="chatForm">
      <textarea id="box" placeholder="Type as the customer, then Enter to send (Shift+Enter = newline)"></textarea>
      <button type="submit" id="sendBtn">Send</button>
      <button type="button" class="secondary" id="resetBtn">Reset</button>
    </form>
  </div>

  <div class="col" id="inspectCol">
    <header>Record inspector
      <small>Read-only. Check a customer's live records before &amp; after a turn.</small>
    </header>
    <div class="pad">
      <div class="row">
        <select id="tool">
          <option value="get_user_information_by_id">get_user_information_by_id</option>
          <option value="get_user_information_by_email">get_user_information_by_email</option>
          <option value="get_user_information_by_name">get_user_information_by_name</option>
          <option value="get_credit_card_accounts_by_user">get_credit_card_accounts_by_user</option>
          <option value="get_credit_card_transactions_by_user">get_credit_card_transactions_by_user</option>
          <option value="get_referrals_by_user">get_referrals_by_user</option>
        </select>
      </div>
      <div class="row">
        <input id="argKey" value="user_id" placeholder="arg name (user_id / email / customer_name)" />
        <input id="argVal" placeholder="value (e.g. 123)" />
        <button type="button" id="inspectBtn">Read</button>
      </div>
      <div class="hint">Fixtures: Mia 123 · Alex 126 · Liu 3d91a520be · Emily 4db6fc36e8 · Bei 601e851551 · Maria d97fb90fe8</div>
      <pre id="inspectOut">(no query yet)</pre>
    </div>
  </div>

<script>
  let messages = [];
  const log = document.getElementById("log");
  const box = document.getElementById("box");
  const sendBtn = document.getElementById("sendBtn");

  function render() {
    log.innerHTML = "";
    for (const m of messages) {
      const wrap = document.createElement("div");
      const role = document.createElement("div");
      role.className = "role";
      role.textContent = m.role;
      const bubble = document.createElement("div");
      bubble.className = "msg " + m.role;
      bubble.textContent = typeof m.content === "string" ? m.content : JSON.stringify(m.content);
      wrap.appendChild(role);
      wrap.appendChild(bubble);
      log.appendChild(wrap);
    }
    log.scrollTop = log.scrollHeight;
  }

  async function send() {
    const text = box.value.trim();
    if (!text) return;
    messages.push({ role: "user", content: text });
    box.value = "";
    render();
    sendBtn.disabled = true;
    try {
      const r = await fetch("/send", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const data = await r.json();
      const reply = data?.choices?.[0]?.message?.content ?? JSON.stringify(data);
      messages.push({ role: "assistant", content: reply });
    } catch (e) {
      messages.push({ role: "assistant", content: "[sim error] " + e });
    } finally {
      sendBtn.disabled = false;
      render();
    }
  }

  document.getElementById("chatForm").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  document.getElementById("resetBtn").addEventListener("click", () => { messages = []; render(); });

  document.getElementById("inspectBtn").addEventListener("click", async () => {
    const tool = document.getElementById("tool").value;
    const key = document.getElementById("argKey").value.trim();
    const val = document.getElementById("argVal").value.trim();
    const args = key ? { [key]: val } : {};
    const out = document.getElementById("inspectOut");
    out.textContent = "loading...";
    try {
      const r = await fetch("/inspect", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tool, arguments: args }),
      });
      out.textContent = JSON.stringify(await r.json(), null, 2);
    } catch (e) {
      out.textContent = "[inspect error] " + e;
    }
  });
</script>
</body>
</html>
